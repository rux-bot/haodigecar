<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#df5826" />
    <meta name="description" content="新能源商用车租售车型库，按常温、冷藏及面包、平板、厢货、高栏筛选车型。现车与租售方案请咨询确认。" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>浙江好滴哥物流科技有限公司 · 车型库</title>
  </head>
  <body>
    <div id="root">
      <style>
        .startup-help { max-width: 600px; margin: 12vh auto; padding: 28px; color: #28312e; font: 16px/1.8 system-ui, sans-serif; animation: show-startup-help 1.2s step-end; }
        .startup-help h1 { font-size: 25px; line-height: 1.4; }
        .startup-help a { color: #bc431b; }
        @keyframes show-startup-help { from { opacity: 0; } to { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { .startup-help { animation: none; } }
      </style>
      <main class="startup-help">
        <p>浙江好滴哥物流科技有限公司</p>
        <h1>正在打开车型网站</h1>
        <p>如果页面一直停在这里，且您是直接双击打开的 HTML 文件：</p>
        <ol>
          <li>返回 <strong>vehicle-site</strong> 文件夹。</li>
          <li>双击 <strong>启动网站.cmd</strong>，浏览器会自动打开网站。</li>
        </ol>
        <p>本网站含车型数据库与管理后台，需要通过网站服务访问。首次使用请安装 <a href="https://nodejs.org/" target="_blank" rel="noopener noreferrer">Node.js 24.15 或更高版本</a>，并联网完成依赖安装。</p>
        <p>若您已通过网址访问，请刷新页面；仍无法加载时，请检查网站服务与网络连接。</p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
